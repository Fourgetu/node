name: Verify repository contract

on:
  push:
    paths:
      - 'libs/contract/**'
      - 'tests/unit/node-contract-schema.test.ts'
      - '.github/workflows/deploy-lib.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify contract schema
        run: |
          npm run typecheck
          npm run test:unit
